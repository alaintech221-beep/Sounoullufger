<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark blue background with subtle linear gradient -->
    <linearGradient id="signago-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f24" />
      <stop offset="50%" stop-color="#0d1a3a" />
      <stop offset="100%" stop-color="#162852" />
    </linearGradient>

    <!-- Vibrant French Highway Blue for the road sign -->
    <linearGradient id="signago-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Warm Amber for the SignaGo badge -->
    <linearGradient id="signago-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft elevation shadow for flat modern depth -->
    <filter id="sign-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background extending to all edges (maskable standard) -->
  <rect width="512" height="512" fill="url(#signago-bg)" />

  <!-- Subtle ambient central glow -->
  <circle cx="256" cy="256" r="210" fill="#1e40af" opacity="0.14" />

  <!-- Road sign group: strictly contained within 80% safe zone (radius 166px < 204.8px) -->
  <g filter="url(#sign-shadow)">
    <!-- Outer White Border of Road Sign (B21 style) -->
    <circle cx="256" cy="256" r="166" fill="#ffffff" />

    <!-- Inner Traffic Blue Disc -->
    <circle cx="256" cy="256" r="148" fill="url(#signago-blue)" />

    <!-- Forward Arrow (Flèche vers l'avant - Direction obligatoire / Tout droit) -->
    <path
      d="M256,134 L334,218 L284,218 L284,334 L228,334 L228,218 L178,218 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <!-- Stylized 'G' badge for SignaGo at bottom-right of sign -->
    <circle cx="334" cy="334" r="38" fill="url(#signago-amber)" stroke="#ffffff" stroke-width="5" />

    <!-- Crisp geometric 'G' letterform -->
    <path
      d="M347,322 C344,317 338,313 331,313 C320,313 311,322 311,334 C311,346 320,355 331,355 C341,355 348,348 349,339 L331,339 L331,331 L357,331 L357,339 C355,353 344,363 331,363 C315,363 303,350 303,334 C303,318 315,305 331,305 C341,305 349,309 355,317 Z"
      fill="#ffffff"
    />
  </g>
</svg>
